{% extends 'base.html' %}
{% load static %}

{% block title %}Login | Chelu by Sini{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="form-card shadow-sm">
                <div class="text-center mb-4">
                    <h2 class="font-heading text-brand fs-1">Welcome Back</h2>
                    <p class="text-muted">Sign in to your Chelu account</p>
                </div>
                
                <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Username or Email Address</label>
                        <input type="text" name="username" id="username" class="form-control rounded-0 py-2" placeholder="username or email" required>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                            <a href="#" class="text-brand small text-decoration-none">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" id="password" class="form-control rounded-0 py-2" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-brand w-100 py-2 mb-3">Sign In</button>
                    
                    <div class="text-center mt-3">
                        <span class="text-muted small">New to Chelu by Sini?</span>
                        <a href="{% url 'accounts:signup' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="text-brand small fw-semibold text-decoration-none ms-1">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
